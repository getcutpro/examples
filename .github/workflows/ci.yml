name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: JSON is valid
        run: for file in requests/*.json n8n/*.json; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"; done
      - name: Shell parses
        run: bash -n curl/generate.sh
      - name: Node parses
        run: for file in node/fetch/*.mjs node/sdk/*.mjs; do node --check "$file"; done
      - name: Python parses
        run: python3 -m py_compile python/requests/*.py python/sdk/*.py
      - name: Next.js route typechecks
        run: |
          cd nextjs && npm install --no-audit --no-fund && npm install --no-save typescript@5 @types/node@22
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types node app/api/generations/route.ts
